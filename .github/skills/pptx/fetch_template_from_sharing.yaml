  instructions_for_generation:
    - "Tone: 技術簡報風格，沉穩且具現代科技感。使用深海藍作為主基調，避免鮮豔插圖或卡通元素；整體應傳達「嚴謹、系統化、可執行」的信息。"

    - "Color discipline: 嚴格控制用色。主強調色只有一個（186AFF 電光藍）；成功用 36CBDA、警示用 F75801、特殊規則用 FFD600；說明文字用 B2D9FC/82DFE8；正文依底色選 FFFFFF 或 333333/262626。不得自行引入其他顏色。"

    - "Typography: 全報使用微軟正黑體（Microsoft JhengHei / 微軟正黑體）。中英文混排不換字型。不使用任何襯線字體（Times New Roman、宋體等）。所有文字均設為 Bold（本簡報無 Regular 或 Light 字重用法）。"

    - "Font size hierarchy（必須遵守）: 大數字/KPI 52pt → 封面主標題 40pt → 頁碼標籤 40pt → 章節標題 28-32pt → 卡片標題 20-24pt → 頁標題/列標題 16-20pt → 正文 14-16pt → 最小不低於 14pt。"

    - "Recurring decorators（每頁必須包含）: ① 頂部 5pt 細色條 ② 底部三等份色條（y=518, h=22，三份各 320pt 寬） ③ 左側垂直 5-8pt 強調線 ④ 左上角兩位數章節編號（40pt 186AFF）。"

    - "Charts: 本簡報無傳統統計圖表（長條圖、折線圖等）。數據以卡片式 KPI 大數字、條列式行區塊、結構化表格呈現。若需加入圖表，維持深色背景 + 電光藍系列色，不使用彩虹配色。"

    - "Icons: 使用幾何形狀模擬（矩形/圓角矩形填色）加文字/emoji，無獨立向量圖示引入。偶爾使用 ❌ ✅ 💡 ▼ 等 Unicode 符號作輔助視覺。避免引入第三方圖示庫風格。"

    - "Layout logic: 優先使用「左側欄 + 右側主內容」或「全幅橫條列表」結構。卡片必須是純色矩形（無漸層、無陰影）；卡片頂部一定有色條（4-8pt）。水平比較頁維持嚴格左右對稱。"

    - "Forbidden elements: ① 白色或淺色背景 ② 漸層填色 ③ 任何形式的陰影或毛玻璃 ④ 圓角超過 6pt ⑤ 彩色插圖或 Clipart ⑥ 頁面設計語言不一致的字型 ⑦ 低於 14pt 的文字 ⑧ Regular 或 Light 字重 ⑨ 超過本規格書定義的配色範圍。"

    - "Text color rules: 深色背景上主文一律 FFFFFF；次文用 B2D9FC；輔助說明用 82DFE8 或 8AABCC。淺色卡片底（若有）上用 333333/262626。切勿在深色底上用黑色文字。"

    - "Spacing convention: 橫條行高約 120pt；卡片頂部色條 5-8pt；卡片間留白約 8-16pt；頁面左邊距約 30pt（強調線後），頂部起始約 20-30pt（頂部細線後）。"

    - "Number labeling: 每個章節頁和內容頁左上角必須有兩位數數字標籤（01/02/03/04），40pt Bold 186AFF，置於約 80×70pt 的文字框中，不帶背景色。"